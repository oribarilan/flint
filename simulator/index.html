<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flint Simulator</title>
    <style>
      /* Give the launcher a visible frame since we're not in a borderless Tauri window */
      body {
        margin: 0;
        padding: 40px;
        background: #1a1a2e;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      #root {
        width: 680px;
        height: 500px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
        background: #1e1e2e;
      }
      #sim-banner {
        position: fixed;
        top: 8px;
        right: 8px;
        background: rgba(255, 165, 0, 0.9);
        color: #000;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 600;
        z-index: 9999;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="sim-banner">SIMULATOR</div>
    <div id="root"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
