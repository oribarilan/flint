appId: sh.oribi.flint
productName: Flint
directories:
  buildResources: resources
  output: dist
files:
  - out/**/*
  - "!out/renderer/**/*"
extraResources:
  - from: out/renderer
    to: renderer
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  artifactName: "${productName}-${version}-${arch}.${ext}"
